[package]
name = "repo-viewer"
version = "0.1.0"
description = "A live dashboard of every Git repository beneath a folder."
authors = ["Blake Meyer"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix is load-bearing on Windows specifically: without it the lib and bin names
# collide. See https://github.com/rust-lang/cargo/issues/8519
name = "repo_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# No `[profile.*]` block here. Cargo ignores profile sections in workspace members with only a
# warning, so one here would silently do nothing. It lives in the root Cargo.toml.

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
repo-scan = { path = "../crates/repo-scan" }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Registered in the builder and driven from Rust only. The frontend installs no
# `@tauri-apps/plugin-*` package, which is what keeps capabilities at `core:default`.
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-window-state = { workspace = true }

# The WebView2 probe in `webview2.rs`. Windows-only because the question is: macOS and Linux carry
# their webview in the OS, so there is nothing to detect and nothing to install.
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
# The fetch driver's tests build a throwaway repository to fetch from, because fetching this
# repository would hit the network and this crate is read-only apart from fetch itself.
tempfile = { workspace = true }
